[package]
name = "corescope"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Tiagospem/corescope"
description = "Native sampling core for CoreScope, a developer-focused macOS system monitor"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
