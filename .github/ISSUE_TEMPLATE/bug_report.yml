name: Bug report
description: Something in CoreScope is wrong, crashes or shows misleading data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't include private paths, project names or process lists you'd rather keep private. If you use demo mode (`open --env CORESCOPE_DEMO=1 /Applications/CoreScope.app`), quit CoreScope with ⌘Q before switching modes; project names and path components may still be visible. Inspect and redact screenshots before sharing.
        Security issues go through [private reporting](https://github.com/Tiagospem/corescope/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: CoreScope version
      description: CoreScope → About, or the release you downloaded.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu → About This Mac, or `sw_vers`.
      placeholder: "macOS 15.4 (24E248)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Chip and memory, e.g. from About This Mac.
      placeholder: "MacBook Air M4, 16 GB"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Release DMG
        - Built from source (./scripts/build.sh)
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Overview
        - Processes (tree / list)
        - Agents
        - Storage
        - Sensors
        - Settings
        - Menu bar
        - Floating panel
        - Terminating processes
        - Other / not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Processes page
        2. Select …
        3. Click ✕ …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or crash reports
      description: For crashes, attach the report from Console → Crash Reports (CoreScope). For screenshots, quit CoreScope with ⌘Q before switching to demo mode, then inspect and redact the capture before sharing; project names and path components may remain visible.
