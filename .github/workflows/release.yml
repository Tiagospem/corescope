name: Release

# Pushing a tag v<version> builds, packages and publishes a GitHub Release.
# Pull requests that touch the release tooling run the same packaging as a dry run
# (artifacts uploaded to the run, nothing published).
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/build.sh
      - scripts/package.sh
      - scripts/release-notes.sh

permissions:
  contents: read

jobs:
  package:
    name: Package (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the release notes
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build and package
        run: ./scripts/package.sh

      - name: Check version against tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/CoreScope.app/Contents/Info.plist)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $REF_NAME does not match bundle version $VERSION (scripts/build.sh)"
            exit 1
          fi
          test -f "dist/CoreScope-$VERSION-macos-universal.dmg"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/release-notes.sh "$VERSION" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          gh release create "$TAG" --verify-tag \
            --title "CoreScope $VERSION" \
            --notes-file RELEASE_NOTES.md \
            "CoreScope-$VERSION-macos-universal.dmg" \
            "CoreScope-$VERSION-macos-universal.zip" \
            SHA256SUMS.txt
