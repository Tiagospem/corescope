name: Release

# Pushing a tag v<version> builds, packages and publishes a GitHub Release.
# Pull requests that touch the release tooling run the same packaging as a dry run
# (artifacts uploaded to the run, nothing published).
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/build.sh
      - scripts/package.sh
      - scripts/release-notes.sh
      - scripts/bump-cask.sh
      - packaging/homebrew/**
      - scripts/appcast.sh
      - scripts/appcast.swift
      - scripts/sparkle.sh
      - native/UpdateLogic.swift

permissions:
  contents: read

jobs:
  package:
    name: Package (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the release notes
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build and package
        run: ./scripts/package.sh

      - name: Check version against tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/CoreScope.app/Contents/Info.plist)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $REF_NAME does not match bundle version $VERSION (scripts/build.sh)"
            exit 1
          fi
          test -f "dist/CoreScope-$VERSION-macos-universal.dmg"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign the update and write the appcast
        env:
          REF_TYPE: ${{ github.ref_type }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            ./scripts/appcast.sh
          elif [ "$REF_TYPE" = tag ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set: the release would have no signed appcast, so no app could update to it (CONTRIBUTING.md › Releases)"
            exit 1
          else
            # Dry run without the secret: a throwaway key exercises signing and the feed, and the
            # appcast is dropped (its signature matches no shipped app).
            swiftc -O native/UpdateLogic.swift scripts/appcast.swift -o build/appcast
            KEY=$(build/appcast keygen)
            SPARKLE_ED_PRIVATE_KEY=$(echo "$KEY" | sed -n 's/^private: //p') \
              EXPECTED_PUBLIC_KEY=$(echo "$KEY" | sed -n 's/^public: //p') ./scripts/appcast.sh
            cat dist/appcast.xml >> "$GITHUB_STEP_SUMMARY"
            rm dist/appcast.xml
          fi

      - name: Check the Homebrew cask bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA=$(awk -v f="CoreScope-$VERSION-macos-universal.zip" '$2 == f { print $1 }' dist/SHA256SUMS.txt)
          cp packaging/homebrew/corescope.rb build/corescope.rb
          ./scripts/bump-cask.sh build/corescope.rb "$VERSION" "$SHA"
          ruby -c build/corescope.rb

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/release-notes.sh "$VERSION" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          test -f appcast.xml
          gh release create "$TAG" --verify-tag \
            --title "CoreScope $VERSION" \
            --notes-file RELEASE_NOTES.md \
            "CoreScope-$VERSION-macos-universal.dmg" \
            "CoreScope-$VERSION-macos-universal.zip" \
            SHA256SUMS.txt appcast.xml

  # Optional: with a HOMEBREW_TAP_TOKEN secret (a fine-grained token with Contents read and write on
  # Tiagospem/homebrew-tap only), the published release's version and zip checksum go into the tap's
  # Casks/corescope.rb, seeded from packaging/homebrew/corescope.rb when the tap has none yet.
  # Without the secret the job does nothing.
  homebrew:
    name: Bump the Homebrew cask
    needs: [package, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          path: corescope
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: Tiagospem/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          name: release
          path: dist

      - name: Update and push the cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          SHA=$(awk -v f="CoreScope-$VERSION-macos-universal.zip" '$2 == f { print $1 }' dist/SHA256SUMS.txt)
          mkdir -p tap/Casks
          [ -f tap/Casks/corescope.rb ] || cp corescope/packaging/homebrew/corescope.rb tap/Casks/corescope.rb
          ./corescope/scripts/bump-cask.sh tap/Casks/corescope.rb "$VERSION" "$SHA"
          cd tap
          git add Casks/corescope.rb
          if git diff --cached --quiet; then
            echo "The tap already has CoreScope $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "corescope $VERSION"
          git push
